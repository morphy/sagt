baseURL: https://sagt.com.pl/
title: SAGT
defaultContentLanguage: pl

publishDir: dist

languages:
  pl:
    contentDir: content/pl
    languageName: Polski
    languageCode: pl
    weight: 10
  en:
    contentDir: content/en
    languageName: English
    languageCode: en
    weight: 20
  de:
    contentDir: content/de
    languageName: Deutsch
    languageCode: de
    weight: 30
  es:
    contentDir: content/es
    languageName: Español
    languageCode: es
    weight: 40

menus:
