<header class="fixed top-0 z-20 w-full bg-slate-900">
  <div
    class="container flex flex-wrap items-center justify-between gap-8 py-5 lg:flex-nowrap"
  >
    <a
      class="order-1 mr-auto flex shrink-0 items-center gap-6 lg:mr-0"
      href="/"
    >
      {{ with resources.Get site.Params.logo }}
        <img class="size-16" src="{{ .RelPermalink }}" alt="Logo SAGT" />
      {{ end }}


      <span class="hidden text-center text-white 2xl:inline">
        {{ site.Params.longTitle | safeHTML }}
      </span>
    </a>

    <nav
      class="order-5 hidden basis-full lg:order-2 lg:block lg:basis-auto"
      id="menu"
    >
      {{ partial "header/menu.html" (dict "menuID" "main" "page" .) }}
    </nav>

    {{ partial "header/languageMenu.html" . }}


    <button
      class="order-4 w-10 cursor-pointer text-white lg:hidden"
      id="menuButton"
    >
      {{ with resources.Get "svg/icons/list.svg" }}
        {{ .Content | safeHTML }}
      {{ end }}
    </button>
  </div>
</header>
