<div class="flex flex-col gap-10">
  {{ range . }}

    <div class="flex items-start gap-10">
      {{ with resources.Get .img }}
        <img
          class="hidden aspect-square shrink-0 rounded-3xl object-cover md:block md:w-64 lg:w-72"
          src="{{ .RelPermalink }}"
        />
      {{ end }}


      <div
        class="prose flex max-w-none grow flex-col rounded-3xl border border-neutral-300 p-10"
      >
        <h3>{{ .title }}</h3>

        <hr class="mb-4 border-yellow-500" />

        <h4>{{ .subtitle }}</h4>

        {{ range .paragraphs }}
          <p>{{ . | safeHTML }}</p>
        {{ end }}

        {{ if .list }}
          <ul>
            {{ range .list }}
              <li>{{ . | safeHTML }}</li>
            {{ end }}
          </ul>
        {{ end }}

      </div>
    </div>
  {{ end }}
</div>
