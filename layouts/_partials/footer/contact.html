<div>
  <div class="mx-auto lg:max-w-5/6">
    <h2 class="mb-5 scroll-mt-32" id="{{ i18n "contactHeaderId" }}">
      Dane kontaktowe
    </h2>
    <hr class="mb-10" />

    {{ range .Site.Data.contact }}
      <p
        class="my-4 flex flex-col justify-between text-neutral-600 sm:flex-row"
      >
        <span>{{ .name }}</span>
        <span class="font-medium">{{ .value }}</span>
      </p>

      <hr class="w-full border border-neutral-200" />
    {{ end }}

  </div>
</div>
